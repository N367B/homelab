name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: python -m pip install ansible-core

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r configure/requirements.yml

      - name: Syntax check
        run: make syntax

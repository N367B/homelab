---
# Incus from the Zabbly repository, maintained by the Incus lead developer. Debian 13 ships the older 6.0 LTS.
# The Zabbly package also bundles nvidia-container-cli, which nvidia.runtime needs.
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add Zabbly signing key
  ansible.builtin.get_url:
    url: https://pkgs.zabbly.com/key.asc
    dest: /etc/apt/keyrings/zabbly.asc
    owner: root
    group: root
    mode: "0644"

- name: Add Zabbly Incus repository
  ansible.builtin.deb822_repository:
    name: "zabbly-incus-{{ incus_channel }}"
    types: deb
    uris: "https://pkgs.zabbly.com/incus/{{ incus_channel }}"
    suites: "{{ ansible_distribution_release }}"
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/zabbly.asc

- name: Install Incus
  ansible.builtin.apt:
    name: incus
    state: present
    update_cache: true

- name: Let the admin user drive Incus
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: incus-admin
    append: true

- name: Check whether Incus is initialized
  ansible.builtin.command: incus storage list --format csv
  register: incus_pools
  changed_when: false
  check_mode: false

# Only on a fresh Incus. The preseed creates the bridge, the ZFS storage pool and the default profile.
# Running it again would fail on the existing objects, and later changes belong to OpenTofu.
- name: Initialize Incus
  ansible.builtin.command:
    cmd: incus admin init --preseed
    stdin: "{{ lookup('ansible.builtin.template', 'preseed.yaml.j2') }}"
  when: incus_pools.stdout | trim | length == 0
  changed_when: true

---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

# The installer only enables main and non-free-firmware. Extra components get their own file so the installer's sources stay untouched.
- name: Add extra Debian components
  ansible.builtin.deb822_repository:
    name: "debian-{{ item.name }}"
    types: deb
    uris: "{{ item.uri }}"
    suites: "{{ item.suites }}"
    components: "{{ debian_extra_components }}"
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
  loop:
    - { name: extra, uri: "http://deb.debian.org/debian", suites: ["{{ ansible_distribution_release }}", "{{ ansible_distribution_release }}-updates"] }
    - { name: extra-security, uri: "http://security.debian.org/debian-security", suites: ["{{ ansible_distribution_release }}-security"] }
  loop_control:
    label: "{{ item.name }}"
  when: debian_extra_components | length > 0

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Passwordless sudo for the admin user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Manage admin SSH authorized keys
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    state: present
    key: "{{ item }}"
  loop: "{{ admin_authorized_keys }}"
  when: admin_authorized_keys is defined

# Static resolv.conf, with no dhcpcd/resolved/resolvconf here. Real nameservers are required so Docker's embedded DNS can forward. Without them, containers on user-defined networks get SERVFAIL.
- name: Configure DNS resolvers
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"

- name: Install Renovate-managed sops binary
  ansible.builtin.get_url:
    url: "https://github.com/getsops/sops/releases/download/{{ sops_version }}/sops-{{ sops_version }}.linux.amd64"
    dest: /usr/local/bin/sops
    owner: root
    group: root
    mode: "0755"

- name: Harden SSH (drop-in)
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/90-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: sshd -t -f %s
  notify: Restart sshd

- name: Create systemd-logind drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: disable_physical_power_button | bool

- name: Disable physical power button
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/10-homelab-power-key.conf
    content: |
      [Login]
      HandlePowerKey=ignore
      HandlePowerKeyLongPress=ignore
    owner: root
    group: root
    mode: "0644"
  notify: Restart logind
  when: disable_physical_power_button | bool

- name: Configure nftables firewall
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: nft --check --file %s
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

# The Debian defaults cover the point releases and security. Extra origins add third-party repositories.
- name: Add extra origins to unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51homelab-origins
    content: |
      Unattended-Upgrade::Origins-Pattern {
      {% for origin in unattended_upgrades_extra_origins %}
          "{{ origin }}";
      {% endfor %}
      };
    owner: root
    group: root
    mode: "0644"
  when: unattended_upgrades_extra_origins | length > 0

- name: Configure zram swap (half of RAM, zstd)
  ansible.builtin.copy:
    dest: /etc/default/zramswap
    content: |
      ALGO=zstd
      PERCENT=50
    owner: root
    group: root
    mode: "0644"
  notify: Restart zramswap

# QUIC/HTTP3 wants large UDP buffers. The default around 208 KiB makes Caddy warn and limits HTTP/3. quic-go asks for about 7 MiB.
- name: Raise UDP buffer limits for QUIC/HTTP3
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "7340032"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.core.rmem_max
    - net.core.wmem_max

- name: Schedule monthly btrfs scrub on /
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: btrfs-scrub-root.service
      content: |
        [Unit]
        Description=Btrfs scrub on /
        [Service]
        Type=oneshot
        ExecStart=/usr/bin/btrfs scrub start -B /
    - name: btrfs-scrub-root.timer
      content: |
        [Unit]
        Description=Monthly btrfs scrub on /
        [Timer]
        OnCalendar=monthly
        RandomizedDelaySec=1h
        Persistent=true
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

- name: Enable btrfs scrub timer
  ansible.builtin.systemd_service:
    name: btrfs-scrub-root.timer
    enabled: true
    state: started
    daemon_reload: true
  # The unit file is only written for real, so check mode cannot find it on a fresh host.
  ignore_errors: "{{ ansible_check_mode }}"

# Root stays on the @rootfs subvolume made by the Debian installer. Snapper adds /.snapshots below it and its apt hook (/etc/apt/apt.conf.d/80snapper) takes a pre and post snapshot around each apt run. No timeline snapshots, the host is rebuilt from the repo and only upgrades need an undo.
- name: Create the snapper config for /
  ansible.builtin.command: snapper --no-dbus -c root create-config /
  args:
    creates: /etc/snapper/configs/root
  when: snapper_root | bool

- name: Tune the snapper config for /
  ansible.builtin.lineinfile:
    path: /etc/snapper/configs/root
    regexp: "^{{ item.key }}="
    line: '{{ item.key }}="{{ item.value }}"'
  loop:
    - { key: TIMELINE_CREATE, value: "no" }
    - { key: NUMBER_LIMIT, value: "20" }
    - { key: NUMBER_LIMIT_IMPORTANT, value: "10" }
  when: snapper_root | bool
  # The config is only created for real, so check mode cannot find it on a fresh host.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable snapper cleanup
  ansible.builtin.systemd_service:
    name: snapper-cleanup.timer
    enabled: true
    state: started
  when: snapper_root | bool
  # Snapper is only installed for real, so check mode cannot find its timer on a fresh host.
  ignore_errors: "{{ ansible_check_mode }}"

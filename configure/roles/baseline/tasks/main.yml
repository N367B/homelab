---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Passwordless sudo for the admin user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Manage admin SSH authorized keys
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    state: present
    key: "{{ item }}"
  loop: "{{ admin_authorized_keys }}"
  when: admin_authorized_keys is defined

# Static resolv.conf, with no dhcpcd/resolved/resolvconf here. Real nameservers are required so Docker's embedded DNS can forward. Without them, containers on user-defined networks get SERVFAIL.
- name: Configure DNS resolvers
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"

- name: Install Renovate-managed sops binary
  ansible.builtin.get_url:
    url: "https://github.com/getsops/sops/releases/download/{{ sops_version }}/sops-{{ sops_version }}.linux.amd64"
    dest: /usr/local/bin/sops
    owner: root
    group: root
    mode: "0755"

- name: Harden SSH (drop-in)
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/90-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: sshd -t -f %s
  notify: Restart sshd

- name: Create systemd-logind drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: disable_physical_power_button | bool

- name: Disable physical power button
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/10-homelab-power-key.conf
    content: |
      [Login]
      HandlePowerKey=ignore
      HandlePowerKeyLongPress=ignore
    owner: root
    group: root
    mode: "0644"
  notify: Restart logind
  when: disable_physical_power_button | bool

- name: Configure nftables firewall
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: nft --check --file %s
  notify: Reload nftables

- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Configure zram swap (half of RAM, zstd)
  ansible.builtin.copy:
    dest: /etc/default/zramswap
    content: |
      ALGO=zstd
      PERCENT=50
    owner: root
    group: root
    mode: "0644"
  notify: Restart zramswap

# QUIC/HTTP3 wants large UDP buffers. The default around 208 KiB makes Caddy warn and limits HTTP/3. quic-go asks for about 7 MiB.
- name: Raise UDP buffer limits for QUIC/HTTP3
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "7340032"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.core.rmem_max
    - net.core.wmem_max

- name: Schedule monthly btrfs scrub on /
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: btrfs-scrub-root.service
      content: |
        [Unit]
        Description=Btrfs scrub on /
        [Service]
        Type=oneshot
        ExecStart=/usr/bin/btrfs scrub start -B /
    - name: btrfs-scrub-root.timer
      content: |
        [Unit]
        Description=Monthly btrfs scrub on /
        [Timer]
        OnCalendar=monthly
        RandomizedDelaySec=1h
        Persistent=true
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

- name: Enable btrfs scrub timer
  ansible.builtin.systemd_service:
    name: btrfs-scrub-root.timer
    enabled: true
    state: started
    daemon_reload: true


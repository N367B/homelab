---
- name: Restart sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Restart logind
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: restarted

- name: Reload nftables
  ansible.builtin.command:
    cmd: nft -f /etc/nftables.conf
  changed_when: true

- name: Restart zramswap
  ansible.builtin.systemd_service:
    name: zramswap
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

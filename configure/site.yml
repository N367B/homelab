---
# Full lab convergence. Run interactively from the admin workstation:
#   ansible-playbook site.yml
# Drift detection (scheduled from the edge controller container):
#   ansible-playbook site.yml --check --diff

- name: Baseline for all nodes
  hosts: all
  become: true
  roles:
    - baseline

- name: Edge node — Docker host for core services
  hosts: edge_nodes
  become: true
  pre_tasks:
    - name: Load edge sensitive vars
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets/environment.sops.yaml"
      no_log: true
  roles:
    - { role: network, tags: [network] }
    - docker_host
    - compose_stacks
    - edge_backup
    - wireguard
    - { role: nut, tags: [nut] }
    - { role: ml350_fans, tags: [fans] }
    - { role: monitoring_base, tags: [monitoring] }
    # Needs the iLO key installed by ml350_fans.
    - { role: ilo_watch, tags: [monitoring] }

# Docker stays off the bare-metal host. It sets the FORWARD policy to drop, which cuts the Incus bridge, and the apps run in Incus containers anyway.
- name: Compute node — ZFS, GPU and Incus
  hosts: compute_nodes
  become: true
  roles:
    - { role: network, tags: [network] }
    - { role: monitoring_base, tags: [monitoring] }
    - { role: zfs, tags: [zfs] }
    - { role: nvidia, tags: [nvidia] }
    - { role: incus_host, tags: [incus] }
    - { role: ml350_fans, ml350_fans_mode: agent, tags: [fans] }

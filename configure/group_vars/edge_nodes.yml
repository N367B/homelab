---
# DNS (53), DHCP (67/68), ingress (80/443 + 443/udp HTTP/3);
# 3000 AdGuard UI, 8123 Home Assistant (both host-networked, reverse-proxied by Caddy).
# Add 51820/udp when WireGuard lands.
firewall_open_tcp: [22, 53, 80, 443, 3000, 8123]
firewall_open_udp: [53, 67, 68, 443]

# Edge resolves via the gateway + public fallback, NOT its own AdGuard: AdGuard's
# *.{{ homelab_domain }} split-horizon rewrite would hijack Caddy/certmagic zone lookups and
# break ACME. LAN/public IPs (not 127.0.0.1) so Docker embedded DNS can forward.
dns_nameservers: [10.0.0.1, 1.1.1.1]

# Shared external Docker networks created before stacks deploy, so bridged
# services (Caddy <-> Authentik) can resolve each other by name.
compose_networks:
  - edge

# Compose stacks deployed by the compose_stacks role. `secret` (optional) is a
# file under secrets/, decrypted on the controller and rendered to the stack's
# .env at deploy time — the age key never reaches the node.
compose_stacks:
  - name: caddy
    path: edge/caddy
    secret: edge-caddy.sops.env
  - name: ddns
    path: edge/ddns
    secret: edge-ddns.sops.env
  - name: adguard
    path: edge/adguard
    secret_vars: edge-adguard.sops.yaml
    config_template: AdGuardHome.yaml.j2
    config_dest: conf/AdGuardHome.yaml
  - name: authentik
    path: edge/authentik
    secret: edge-authentik.sops.env
  - name: homeassistant
    path: edge/homeassistant

---
admin_user: noe
timezone: Europe/Paris
dns_nameservers: [192.168.7.1] # default gateway, groups override

admin_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEkuYBYtb+I4Smu5BKJOS0rHLkzzZRl+XJ6RCM+W1ULj noe@homelab"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAkAJwjNzEzBbmgFFUaYGZyahRaWh0593LuADF5po6gN noe@omnibook"

# Base packages present on every node
baseline_packages:
  - btrfs-progs
  - chrony
  - curl
  - git
  - htop
  - nftables
  - python3
  - python3-debian
  - snapper
  - sudo
  - unattended-upgrades
  - wireguard-tools
  - zram-tools
  - age
  - btop
  - micro
  - fzf
  - inxi
# sops and grub-btrfs come from upstream releases (baseline role), not apt
# renovate: datasource=github-releases depName=getsops/sops
sops_version: v3.13.3

# Firewall defaults. Every node accepts SSH, groups extend these lists.
firewall_open_tcp: [22]
firewall_open_udp: []
firewall_allow_tcp: []
firewall_allow_udp: []
# Interfaces that may reach the DHCP and DNS server of the host, for example a container bridge served by Incus.
firewall_dhcp_dns_interfaces: []
disable_physical_power_button: false

# Extra Debian components on top of main and non-free-firmware, for example contrib for ZFS.
debian_extra_components: []
# Origins-Pattern entries added to the Debian defaults of unattended-upgrades.
unattended_upgrades_extra_origins: []
# Snapper config for / with snapshots around each apt run. Needs a BTRFS root.
snapper_root: false

# Notifications. An empty topic keeps alerts in the journal only. ntfy.sh topics are public to anyone who knows the name, so the real topic belongs in SOPS.
notify_ntfy_url: https://ntfy.sh
notify_ntfy_topic: ""

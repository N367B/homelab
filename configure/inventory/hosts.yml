all:
  vars:
    ansible_user: noe
    ansible_ssh_private_key_file: ~/.ssh/homelab
  children:
    edge_nodes:
      hosts:
        edge:
          ansible_host: 192.168.7.10
          # 24/7 critical services (DNS, ingress, identity, VPN)
    compute_nodes:
      hosts:
        compute:
          ansible_host: 192.168.7.11
          # Incus, ZFS pools, app workloads. Off at night.

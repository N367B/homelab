# Based on the official example: https://github.com/favonia/cloudflare-ddns
services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1.17.0
    network_mode: host
    restart: always
    user: "1000:1000"
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    environment:
      # Rendered at deploy time: sops decrypt secrets/edge-ddns.sops.env > .env
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAINS=${HOMELAB_DOMAIN}
      - PROXIED=false # Cloudflare stays DNS-only (docs/network.md)
      - IP6_PROVIDER=none # IPv6 deferred (docs/network.md)
